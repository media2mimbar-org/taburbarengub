name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'rombak/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start Supabase Local
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,functions,realtime,vector,analytics

      # Tes perilaku DB (pgTAP, supabase/tests): gerbang, kuis, naskah, pendaftaran.
      - name: Test database
        run: supabase test db

      # Env di level workflow menunjuk ke example.supabase.co (dummy untuk build).
      # Step ini WAJIB menimpanya ke instance lokal, kalau tidak probe koneksi
      # gagal dan 7 test integrasi RPC skip tanpa pernah menyentuh database.
      - name: Test
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: npm test

      - name: Build
        run: npm run build
